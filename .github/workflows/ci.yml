name: ParcelPulse CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Lint
        run: ruff check app/parcelpulse tests scripts_send_event.py
      - name: Test
        env:
          PYTHONPATH: app
          WEBHOOK_SECRET: test-secret
        run: pytest -q
      - name: Build container image
        run: docker build -t parcelpulse:ci ./app
